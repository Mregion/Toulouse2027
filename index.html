<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sub-75 Training Plan</title>
<style>
*{box-sizing:border-box}
:root{--bg:#0f1115;--card:#171a20;--border:#2a3038;--text:#f4f6f8;--muted:#9aa4af;--accent:#58d6b9;--accentSoft:#132822}
body{margin:0;font-family:Arial,Helvetica,sans-serif;background:var(--bg);color:var(--text)}
.container{width:min(780px,92%);margin:auto;padding:42px 0 60px}
h1{margin:0 0 28px;font-size:38px;letter-spacing:-.03em}
.week-box{margin-bottom:24px}
label{display:block;margin-bottom:8px;color:var(--muted);font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.07em}
select{width:100%;background:var(--card);color:var(--text);border:1px solid var(--border);border-radius:12px;padding:14px 15px;font-size:16px;outline:none}
.session{background:var(--card);border:1px solid var(--border);border-radius:15px;padding:19px 20px;margin-bottom:13px}
.top{display:flex;justify-content:space-between;align-items:center;gap:14px;margin-bottom:10px}
h2{margin:0;font-size:20px}
.tag{flex:0 0 auto;color:var(--accent);background:var(--accentSoft);border:1px solid #28584d;border-radius:999px;padding:5px 9px;font-size:11px;font-weight:700}
.main{font-size:17px;font-weight:700;line-height:1.5}
.details{margin-top:9px;color:var(--muted);font-size:14px;line-height:1.7}
.details strong{color:var(--text)}
.note{color:var(--muted);font-size:12px;line-height:1.55;margin-top:18px;padding:0 2px}
@media(max-width:520px){h1{font-size:31px}.top{align-items:flex-start}}
</style>
</head>
<body>

<option value="2026-09-21">21–27 September 2026</option>

<option value="2027-02-01">1–7 February 2027</option>
    </select>
  </div>

  <div id="sessions"></div>

  <div class="note">
    Wednesday is the main quality run. Monday and Friday support running frequency without competing with gym recovery.
    Target speeds are starting targets and can be changed from your actual results as training progresses.
  </div>
</div>

function renderWeek(key){
  const week = plan[key];
  document.getElementById("sessions").innerHTML = order.map(([field, day]) => {
    const s = week[field];
    return `
      <section class="session">
        <div class="top">
          <h2>${day}</h2>
          <span class="tag">${s[0]}</span>
        </div>
        <div class="main">${s[1]}</div>
